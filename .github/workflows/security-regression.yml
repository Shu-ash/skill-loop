name: Security regression tests

on:
  push:
    branches:
      - security-fixes-2026-11-08
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/security-regression.yml"

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit findings
        run: npm audit --json > audit.json || node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, v.fixAvailable); console.log('Total vulnerabilities:', a.metadata?.vulnerabilities)"
      - name: Run security regression tests
        run: npm test
